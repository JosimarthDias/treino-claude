<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu primeiro projeto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #0f172a;
      --cartao: #1e293b;
      --texto: #e2e8f0;
      --azul: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--fundo);
      color: var(--texto);
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 48px 32px;
      background: var(--cartao);
      border-top: 4px solid var(--azul);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2.25rem;
      color: var(--azul);
    }

    p {
      margin: 0;
      font-size: 1.125rem;
      line-height: 1.6;
    }

    .botoes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .botao {
      display: inline-block;
      padding: 12px 28px;
      border: 2px solid var(--azul);
      background: var(--azul);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      transition: background 0.2s, transform 0.2s;
    }

    .botao:hover,
    .botao:focus-visible {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .botao-contorno {
      background: transparent;
      color: var(--azul);
    }

    .botao-contorno:hover,
    .botao-contorno:focus-visible {
      background: var(--azul);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Meu primeiro projeto</h1>
    <p>Sou músico e estou aprendendo a usar IA para criar projetos digitais.</p>
    <div class="botoes">
      <a class="botao" href="https://linktr.ee/josimarthdias_oficial" target="_blank" rel="noopener noreferrer">Ouça minhas músicas e me siga</a>
      <a class="botao botao-contorno" href="https://www.instagram.com/josimarthdias_oficial/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="botao botao-contorno" href="https://www.tiktok.com/@josimarthdias" target="_blank" rel="noopener noreferrer">TikTok</a>
    </div>
  </main>
</body>
</html>
